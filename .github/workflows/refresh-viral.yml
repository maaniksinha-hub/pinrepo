name: Refresh viral repos

on:
  schedule:
    # Every 6 hours — catch repos as they start going viral
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-viral.cjs"
      - "scripts/generate-cover.cjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover viral GitHub repos + generate covers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/refresh-viral.cjs
        
        - name: Commit & push if changed
        id: commit
        run: |
    git config user.name "pinrepo-bot"
    git config user.email "bot@pinrepo.local"
    git add src/data/viral-repos.json public/covers/viral-*.webp
    if git diff --staged --quiet; then
      echo "No viral catalog changes"
      echo "changed=false" >> "$GITHUB_OUTPUT"
      exit 0
    fi
    git commit -m "chore: refresh viral git repositories $(date -u +%Y-%m-%dT%H:%MZ)"
    git push
    echo "changed=true" >> "$GITHUB_OUTPUT"

- name: Deploy to Vercel production
  if: always()
  env:
    VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
  run: |
    if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
      echo "VERCEL_DEPLOY_HOOK secret not set — add a Deploy Hook in Vercel project settings"
      exit 0
    fi
    curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
    echo "Triggered Vercel production deploy"
